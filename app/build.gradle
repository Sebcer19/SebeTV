plugins { id 'com.android.application' }
android {
    namespace 'fr.sebcer.sebetv'
    compileSdk 35
    defaultConfig {
        applicationId 'fr.sebcer.sebetv'
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName '0.10.0'
    }
    signingConfigs {
        personal {
            storeFile file(System.getenv('SEBETV_KEYSTORE') ?: "../../private-signing/sebetv.jks")
            storePassword System.getenv('SEBETV_STORE_PASSWORD')
            keyAlias 'sebetv'
            keyPassword System.getenv('SEBETV_KEY_PASSWORD')
        }
    }
    buildTypes { release { signingConfig signingConfigs.personal; minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
